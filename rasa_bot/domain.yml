version: "3.1"

intents:
  - saludar
  - despedir
  - consultar_productos
  - cotizar_porton
  - informar_medidas
  - elegir_tipo_porton
  - elegir_madera
  - agregar_accesorio
  - confirmar
  - negar
  - consultar_estado_pedido
  - hablar_con_asesor
  - consultar_informacion

entities:
  - tipo_porton
  - tipo_madera
  - ancho
  - alto
  - accesorio
  - codigo_pedido

# Los slots de la cotización no influyen en la predicción de acciones: el formulario decide qué preguntar.
# Las entidades se toman en cualquier momento (un cliente puede dar tipo y medidas en el primer mensaje),
# salvo cuando solo consulta el catálogo. Las mapeadas como `custom` las completa
# validate_formulario_cotizacion, que además lee medidas como "4x2,20" que el tokenizador no separa.
slots:
  tipo_porton:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: tipo_porton
        not_intent: consultar_productos
  ancho:
    type: float
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: ancho
        not_intent: consultar_productos
      - type: custom
  alto:
    type: float
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: alto
        not_intent: consultar_productos
      - type: custom
  medidas_confirmadas:
    type: bool
    influence_conversation: false
    mappings:
      - type: from_intent
        intent: confirmar
        value: true
        conditions:
          - active_loop: formulario_cotizacion
            requested_slot: medidas_confirmadas
      - type: from_intent
        intent: negar
        value: false
        conditions:
          - active_loop: formulario_cotizacion
            requested_slot: medidas_confirmadas
  # Madera elegida: el nombre tal como la ofrece el backend ("Tajibo 30″") y su id, que fija la validación.
  # Las maderas y sus precios salen de la base de datos; el bot no conoce ninguna de antemano.
  tipo_madera:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: tipo_madera
        not_intent: consultar_productos
      - type: custom
  madera_id:
    type: any
    influence_conversation: false
    mappings:
      - type: custom
  accesorios:
    type: list
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: accesorio
        not_intent: consultar_productos
      - type: custom
  fuera_ciudad:
    type: bool
    influence_conversation: false
    mappings:
      - type: from_intent
        intent: confirmar
        value: true
        conditions:
          - active_loop: formulario_cotizacion
            requested_slot: fuera_ciudad
      - type: from_intent
        intent: negar
        value: false
        conditions:
          - active_loop: formulario_cotizacion
            requested_slot: fuera_ciudad
      - type: custom
  # Código del pedido recién cotizado (lo fija action_cotizar).
  pedido_codigo:
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  pedido_confirmado:
    type: bool
    influence_conversation: false
    mappings:
      - type: from_intent
        intent: confirmar
        value: true
        conditions:
          - active_loop: formulario_confirmar_pedido
            requested_slot: pedido_confirmado
      - type: from_intent
        intent: negar
        value: false
        conditions:
          - active_loop: formulario_confirmar_pedido
            requested_slot: pedido_confirmado
  # Día y horario que el cliente prefiere para la reunión con el asesor (texto libre, solo si aceptó la cotización).
  preferencia_reunion:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: formulario_confirmar_pedido
            requested_slot: preferencia_reunion

forms:
  formulario_cotizacion:
    required_slots:
      - tipo_porton
      - ancho
      - alto
      - medidas_confirmadas
      - tipo_madera
      - accesorios
      - fuera_ciudad
  # Tras la cotización: "¿Agendamos una reunión con un asesor?" y, si acepta, qué día y horario le conviene.
  # Si la cotización falló, no pregunta nada. No hay ningún cobro por el bot.
  formulario_confirmar_pedido:
    required_slots:
      - pedido_confirmado
      - preferencia_reunion

actions:
  - validate_formulario_cotizacion
  - validate_formulario_confirmar_pedido
  - action_ask_medidas_confirmadas
  - action_ask_tipo_madera
  - action_ask_accesorios
  - action_ask_fuera_ciudad
  - action_mostrar_catalogo
  - action_cotizar
  - action_procesar_confirmacion_pedido
  - action_reiniciar_cotizacion
  - action_informar_negocio
  - action_consultar_estado_pedido

# Trato de "usted". En WhatsApp, *texto* se muestra en negrita.
# Los títulos de botón tienen como máximo 20 caracteres (límite de WhatsApp).
responses:
  utter_saludo:
    - text: "¡Hola! Soy el asistente virtual de *MACHOBOL*. Fabricamos portones y parques infantiles de madera. ¿En qué le puedo ayudar?"
      buttons:
        - title: "Cotizar portón"
          payload: "/cotizar_porton"
        - title: "Ver productos"
          payload: "/consultar_productos"
        - title: "Hablar con asesor"
          payload: "/hablar_con_asesor"

  utter_menu:
    - text: "¿En qué más le puedo ayudar?"
      buttons:
        - title: "Cotizar portón"
          payload: "/cotizar_porton"
        - title: "Ver productos"
          payload: "/consultar_productos"
        - title: "Hablar con asesor"
          payload: "/hablar_con_asesor"

  utter_despedida:
    - text: "¡Gracias por escribir a MACHOBOL! Aquí estaré cuando me necesite."

  utter_no_entendi:
    - text: "Disculpe, no le entendí. Puedo cotizarle un portón, mostrarle nuestros productos o comunicarle con un asesor."
      buttons:
        - title: "Cotizar portón"
          payload: "/cotizar_porton"
        - title: "Ver productos"
          payload: "/consultar_productos"
        - title: "Hablar con asesor"
          payload: "/hablar_con_asesor"

  utter_no_entendi_formulario:
    - text: "Disculpe, no le entendí."

  utter_derivar_asesor:
    - text: "Con gusto. Un asesor de MACHOBOL le escribirá por este mismo chat lo antes posible."

  utter_ask_tipo_porton:
    - text: "¿Qué tipo de portón necesita? El *corredizo* se desliza sobre un riel y el *batiente* se abre en una o dos hojas."
      buttons:
        - title: "Corredizo"
          payload: '/elegir_tipo_porton{"tipo_porton": "corredizo"}'
        - title: "Batiente"
          payload: '/elegir_tipo_porton{"tipo_porton": "batiente"}'

  utter_tipo_porton_invalido:
    - text: "Fabricamos portones corredizos y batientes."

  utter_ask_ancho:
    - text: "¿Qué medidas tiene el espacio del portón? Indíqueme el ancho y el alto en metros, por ejemplo: *4 x 2,20* (ancho × alto)."

  utter_ask_alto:
    - text: "¿Y cuánto mide de alto? Por ejemplo: 2,20 m."

  utter_corregir_medidas:
    - text: "De acuerdo, corrijamos las medidas."

  utter_accesorio_desconocido:
    - text: "Por ahora ofrecemos como accesorios el motor y la puerta de ingreso peatonal."

  utter_ask_pedido_confirmado:
    - text: "¿Le parece bien la cotización? Si desea avanzar, agendamos una reunión con un asesor para acordar el precio final y la forma de pago. La reunión no tiene costo."
      buttons:
        - title: "Sí, agendar"
          payload: "/confirmar"
        - title: "Tengo dudas"
          payload: "/hablar_con_asesor"
        - title: "Ahora no"
          payload: "/negar"

  utter_ask_preferencia_reunion:
    - text: "¡Perfecto! ¿Qué día y en qué horario le conviene la reunión? Por ejemplo: «el jueves por la tarde»."

  utter_cotizacion_cancelada:
    - text: "Entendido, dejamos la cotización aquí. Cuando quiera retomarla, escríbame «cotizar portón»."

  utter_algo_mas:
    - text: "¿Le puedo ayudar en algo más?"
      buttons:
        - title: "Sí"
          payload: "/confirmar"
        - title: "No, gracias"
          payload: "/negar"

  utter_error_backend:
    - text: "Tuve un problema técnico al consultar nuestro sistema. Un asesor le escribirá en breve por este chat."

session_config:
  # Tras 2 horas sin mensajes empieza una conversación nueva, sin datos de la anterior.
  session_expiration_time: 120
  carry_over_slots_to_new_session: false
